<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مزاج السوق</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#020617;
  --panel:#07111f;
  --panel2:#0b1628;
  --gold:#d4af37;
  --gold2:#b8962e;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:rgba(212,175,55,.28);
  --blue:rgba(56,189,248,.18);
  --green:#22c55e;
  --yellow:#eab308;
  --orange:#f97316;
  --red:#ef4444;
}
body{
  margin:0;
  padding:9px;
  font-family:Arial,sans-serif;
  color:var(--text);
  overflow:hidden;
  background:
    radial-gradient(circle at 88% 8%,rgba(212,175,55,.16),transparent 24%),
    radial-gradient(circle at 8% 92%,rgba(56,189,248,.12),transparent 29%),
    linear-gradient(135deg,#020617,#030712 45%,#020617);
}
.header{
  height:50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 4px;
}
h1{
  margin:0;
  color:var(--gold);
  font-size:32px;
  font-weight:900;
  letter-spacing:.2px;
  text-shadow:0 0 18px rgba(212,175,55,.34);
}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.back{
  color:var(--gold);
  text-decoration:none;
  border:1px solid rgba(212,175,55,.42);
  padding:7px 13px;
  border-radius:999px;
  font-size:12px;
  background:rgba(212,175,55,.06);
}
.screen{
  height:calc(100vh - 60px);
  display:grid;
  grid-template-columns:50% 50%;
  grid-template-rows:86px 1fr 248px;
  gap:9px;
}
.card{
  background:
    linear-gradient(145deg,rgba(11,22,40,.96),rgba(2,6,23,.99));
  border:1px solid var(--line);
  border-radius:18px;
  padding:11px;
  box-shadow:
    0 0 28px rgba(0,0,0,.34),
    0 0 18px rgba(212,175,55,.055),
    inset 0 0 22px rgba(255,255,255,.018);
  overflow:hidden;
}
.gauges{
  grid-column:1/3;
  grid-row:1/2;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
}
.mini{
  background:linear-gradient(145deg,rgba(15,23,42,.88),rgba(3,7,18,.98));
  border:1px solid rgba(212,175,55,.20);
  border-radius:16px;
  padding:8px 10px;
  min-width:0;
}
.mini-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#dbe4ef;
  white-space:nowrap;
}
.mini-head b{color:var(--gold)}
.mini-value{
  font-size:25px;
  font-weight:900;
  color:white;
  margin-top:2px;
  line-height:1;
}
.mini-bar{
  height:7px;
  border-radius:999px;
  background:#111827;
  overflow:hidden;
  margin-top:6px;
  border:1px solid rgba(255,255,255,.035);
}
.mini-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green));
}
.heat{
  grid-column:1/2;
  grid-row:2/3;
}
.decision{
  grid-column:2/3;
  grid-row:2/3;
  display:grid;
  grid-template-columns:52% 48%;
  gap:8px;
  align-items:center;
}
.decision-main{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  height:100%;
}
.decision-title{font-size:13px;color:var(--muted)}
.big-label{
  font-size:42px;
  font-weight:900;
  color:var(--gold);
  margin-top:2px;
  text-shadow:0 0 18px rgba(212,175,55,.32);
}
.big-score{
  font-size:104px;
  font-weight:900;
  color:white;
  line-height:.92;
  margin-top:4px;
  letter-spacing:-3px;
}
.score-sub{font-size:18px;color:var(--muted);margin-top:2px}
.tone{font-size:14px;color:var(--muted);margin-top:6px}
.speed-wrap{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100%;
}
.speed{
  width:272px;
  height:145px;
  border-radius:280px 280px 0 0;
  background:conic-gradient(from 180deg,var(--red) 0deg,var(--orange) 52deg,var(--yellow) 110deg,var(--green) 180deg,transparent 0);
  position:relative;
  overflow:hidden;
  filter:drop-shadow(0 0 18px rgba(212,175,55,.14));
}
.speed:after{
  content:"";
  position:absolute;
  bottom:0;
  left:38px;
  width:196px;
  height:98px;
  background:var(--bg);
  border-radius:200px 200px 0 0;
}
.needle{
  position:absolute;
  bottom:0;
  left:50%;
  width:4px;
  height:123px;
  background:#fff;
  transform-origin:bottom center;
  z-index:5;
  box-shadow:0 0 13px #fff;
}
.center-dot{
  position:absolute;
  bottom:-8px;
  left:calc(50% - 12px);
  width:24px;
  height:24px;
  background:var(--gold);
  border-radius:50%;
  z-index:6;
  box-shadow:0 0 18px rgba(212,175,55,.9);
}
.scale{
  width:260px;
  display:flex;
  justify-content:space-between;
  color:#64748b;
  font-size:10px;
  margin-top:4px;
}
h2{
  margin:0 0 8px;
  color:#f8fafc;
  font-size:17px;
  font-weight:900;
}
h2 span{color:var(--gold)}
.heat-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-auto-rows:86px;
  gap:8px;
  height:calc(100% - 28px);
}
.tile{
  border-radius:15px;
  padding:8px;
  border:1px solid rgba(255,255,255,.07);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-shadow:inset 0 0 18px rgba(255,255,255,.025);
}
.tile b{font-size:13px}
.tile .flow{font-size:23px;font-weight:900;margin:2px 0;color:white}
.tile small{font-size:10px;color:#e5e7eb}
.tile.hot{
  grid-column:span 2;
  grid-row:span 2;
}
.tile.mid{
  grid-column:span 2;
}
.fear{
  grid-column:1/2;
  grid-row:3/4;
  display:grid;
  grid-template-columns:38% 62%;
  gap:10px;
  align-items:center;
}
.fear-box{text-align:center}
.fear-title{color:var(--muted);font-size:13px}
.fear-score{font-size:56px;font-weight:900;color:white;line-height:1}
.fear-label{color:var(--gold);font-weight:900;font-size:23px;margin-top:2px}
.fear-note{font-size:12px;color:var(--muted);margin-top:5px}
.fear-bars .row{margin-bottom:8px}
.sectors{
  grid-column:2/3;
  grid-row:3/4;
}
.row{margin-bottom:6px}
.row-head{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:3px;
  white-space:nowrap;
}
.row-head b{color:var(--gold)}
.bar{
  height:9px;
  background:#111827;
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.035);
}
.fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--orange),var(--yellow),var(--green));
}
.footer{
  position:fixed;
  bottom:3px;
  left:0;
  right:0;
  text-align:center;
  font-size:10px;
  color:#64748b;
}
@media(max-width:1200px){
  body{overflow:auto}
  .screen{
    height:auto;
    grid-template-columns:1fr;
    grid-template-rows:auto;
  }
  .gauges,.decision,.fear,.sectors,.heat{
    grid-column:auto;
    grid-row:auto;
  }
  .gauges{grid-template-columns:repeat(2,1fr)}
  .decision{grid-template-columns:1fr}
  .heat-grid{grid-template-columns:repeat(2,1fr);height:auto}
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>🧭 مزاج السوق</h1>
    <div class="sub">مركز قرار السوق قبل الافتتاح — قراءة مختصرة لكل ظروف التداول</div>
  </div>
  <a class="back" href="/">العودة للوحة الأداء</a>
</div>

<div id="app">جاري تحميل مزاج السوق...</div>

<script>
function angle(v){return (Math.max(0,Math.min(100,Number(v)))*1.8)-90}

function tileColor(score){
  score = Number(score);
  if(score>=80) return "linear-gradient(145deg,rgba(34,197,94,.42),rgba(22,101,52,.24))";
  if(score>=65) return "linear-gradient(145deg,rgba(212,175,55,.40),rgba(113,84,20,.22))";
  if(score>=50) return "linear-gradient(145deg,rgba(249,115,22,.32),rgba(124,45,18,.22))";
  return "linear-gradient(145deg,rgba(239,68,68,.35),rgba(127,29,29,.22))";
}

function fearLabel(v){
  v = Number(v);
  if(v>=85) return "طمع قوي";
  if(v>=70) return "طمع معتدل";
  if(v>=50) return "محايد";
  if(v>=35) return "خوف";
  return "خوف قوي";
}

function demoIfFlat(d){
  const sectors = d.sectors || [];
  const allFlat = sectors.length && sectors.every(s => Number(s.score) === 50 && Number(s.flow) === 0);
  if(!allFlat) return d;

  d.score = 84.8;
  d.decision = {label:"شراء انتقائي", tone:"السوق جيد لكن يحتاج انتقاء", color:"yellow"};
  d.gauges = {
    "الاتجاه العام":100,
    "السيولة":74.2,
    "قوة السوق":64.8,
    "الزخم":100,
    "الخوف والطمع":72,
    "ظروف الأسبوع":80
  };
  d.sectors = [
    {symbol:"XLK",name:"التقنية",score:85,flow:7.61,status:"دخول قوي"},
    {symbol:"XLF",name:"المالي",score:82,flow:5.59,status:"دخول قوي"},
    {symbol:"XLB",name:"المواد",score:78,flow:7.29,status:"دخول قوي"},
    {symbol:"XLI",name:"الصناعي",score:76,flow:6.91,status:"دخول قوي"},
    {symbol:"XLV",name:"الصحي",score:73,flow:1.00,status:"دخول قوي"},
    {symbol:"XLRE",name:"العقاري",score:68,flow:0.72,status:"دخول متوسط"},
    {symbol:"XLP",name:"الاستهلاكي الأساسي",score:62,flow:-0.99,status:"دخول متوسط"},
    {symbol:"XLY",name:"الاستهلاكي الكمالي",score:58,flow:3.07,status:"محايد"},
    {symbol:"XLU",name:"المرافق",score:54,flow:1.98,status:"محايد"},
    {symbol:"XLC",name:"الاتصالات",score:42,flow:-2.00,status:"خروج سيولة"},
    {symbol:"XLE",name:"الطاقة",score:36,flow:-7.55,status:"خروج سيولة"}
  ];
  d.demo = true;
  return d;
}

fetch('/api/market/mood')
.then(r=>r.json())
.then(raw=>{
  let d = demoIfFlat(raw);
  const gaugesObj = d.gauges || {};
  const fearScore = gaugesObj["الخوف والطمع"] || gaugesObj["التقلب"] || 50;

  let gauges = "";
  Object.entries(gaugesObj).forEach(([k,v])=>{
    let title = k === "التقلب" ? "الخوف والطمع" : k;
    gauges += `
      <div class="mini">
        <div class="mini-head"><span>${title}</span><b>${v}%</b></div>
        <div class="mini-value">${v}%</div>
        <div class="mini-bar"><div class="mini-fill" style="width:${v}%"></div></div>
      </div>`;
  });

  let sectorBars = "";
  (d.sectors || []).slice(0,9).forEach((s,i)=>{
    sectorBars += `
      <div class="row">
        <div class="row-head">
          <span>${i+1}. ${s.name} <small>${s.symbol}</small></span>
          <b>${s.score}%</b>
        </div>
        <div class="bar"><div class="fill" style="width:${s.score}%"></div></div>
      </div>`;
  });

  let heat = "";
  (d.sectors || []).forEach((s,i)=>{
    let cls = i===0 ? "hot" : (i===1 || i===2 ? "mid" : "");
    heat += `
      <div class="tile ${cls}" style="background:${tileColor(s.score)}">
        <b>${s.name}</b>
        <div class="flow">${s.flow>0?'+':''}${s.flow}%</div>
        <small>${s.status}</small>
      </div>`;
  });

  document.getElementById("app").className = "screen";
  document.getElementById("app").innerHTML = `
    <div class="gauges">${gauges}</div>

    <div class="card heat">
      <h2><span>🗺️</span> خريطة الأموال</h2>
      <div class="heat-grid">${heat}</div>
    </div>

    <div class="card decision">
      <div class="decision-main">
        <div class="decision-title">القرار النهائي</div>
        <div class="big-label">${d.decision.label}</div>
        <div class="big-score">${d.score}</div>
        <div class="score-sub">من 100</div>
        <div class="tone">${d.decision.tone}</div>
      </div>
      <div class="speed-wrap">
        <div class="speed">
          <div class="needle" style="transform:rotate(${angle(d.score)}deg)"></div>
          <div class="center-dot"></div>
        </div>
        <div class="scale"><span>خارج</span><span>حذر</span><span>انتقائي</span><span>قوي</span></div>
      </div>
    </div>

    <div class="card fear">
      <div class="fear-box">
        <div class="fear-title">😨 مؤشر الخوف والطمع</div>
        <div class="fear-score">${fearScore}%</div>
        <div class="fear-label">${fearLabel(fearScore)}</div>
        <div class="fear-note">مؤشر مستقل لقياس شهية المخاطرة</div>
      </div>
      <div class="fear-bars">
        <div class="row">
          <div class="row-head"><span>الخوف</span><b>${100-fearScore}%</b></div>
          <div class="bar"><div class="fill" style="width:${100-fearScore}%"></div></div>
        </div>
        <div class="row">
          <div class="row-head"><span>الطمع</span><b>${fearScore}%</b></div>
          <div class="bar"><div class="fill" style="width:${fearScore}%"></div></div>
        </div>
        <div class="row">
          <div class="row-head"><span>شهية المخاطرة</span><b>${d.score}%</b></div>
          <div class="bar"><div class="fill" style="width:${d.score}%"></div></div>
        </div>
      </div>
    </div>

    <div class="card sectors">
      <h2><span>💰</span> دوران السيولة بين القطاعات</h2>
      ${sectorBars}
    </div>

    <div class="footer">
      آخر تحديث: ${d.updated_at || "-"} ${d.demo ? " — عرض تجريبي مؤقت حتى ربط البيانات الحقيقية" : ""}
    </div>
  `;
})
.catch(e=>{
  document.getElementById("app").innerHTML = `<div class="card">خطأ في تحميل البيانات: ${e}</div>`;
});
</script>

</body>
</html>
