<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مزاج السوق</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:10px;
  font-family:Arial,sans-serif;
  color:#e5e7eb;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 5%,rgba(250,204,21,.18),transparent 22%),
    radial-gradient(circle at 10% 95%,rgba(14,165,233,.14),transparent 28%),
    #020617;
}
.header{
  height:54px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
h1{
  margin:0;
  color:#facc15;
  font-size:34px;
  font-weight:900;
  text-shadow:0 0 18px rgba(250,204,21,.45);
}
.sub{color:#94a3b8;font-size:12px;margin-top:2px}
.back{
  color:#facc15;
  text-decoration:none;
  border:1px solid rgba(250,204,21,.45);
  padding:7px 13px;
  border-radius:999px;
  font-size:12px;
}
.screen{
  height:calc(100vh - 64px);
  display:grid;
  grid-template-columns:26% 36% 38%;
  grid-template-rows:18% 41% 41%;
  gap:9px;
}
.card{
  background:linear-gradient(145deg,rgba(15,23,42,.97),rgba(2,6,23,.98));
  border:1px solid rgba(56,189,248,.24);
  border-radius:18px;
  padding:12px;
  box-shadow:0 0 24px rgba(56,189,248,.08);
  overflow:hidden;
}
.decision{
  grid-column:2/3;
  grid-row:1/3;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.decision-title{font-size:13px;color:#94a3b8}
.big-label{
  font-size:42px;
  font-weight:900;
  color:#facc15;
  margin-top:4px;
  text-shadow:0 0 18px rgba(250,204,21,.35);
}
.big-score{
  font-size:90px;
  font-weight:900;
  color:white;
  line-height:.95;
  margin-top:6px;
}
.tone{font-size:14px;color:#94a3b8;margin-top:8px}

.speed{
  width:300px;
  height:160px;
  border-radius:300px 300px 0 0;
  background:conic-gradient(from 180deg,#ef4444 0deg,#f97316 52deg,#eab308 110deg,#22c55e 180deg,transparent 0);
  position:relative;
  overflow:hidden;
  margin:8px auto 0;
  filter:drop-shadow(0 0 18px rgba(250,204,21,.16));
}
.speed:after{
  content:"";
  position:absolute;
  bottom:0;
  left:42px;
  width:216px;
  height:108px;
  background:#020617;
  border-radius:220px 220px 0 0;
}
.needle{
  position:absolute;
  bottom:0;
  left:50%;
  width:4px;
  height:136px;
  background:white;
  transform-origin:bottom center;
  z-index:5;
  box-shadow:0 0 14px white;
}
.center-dot{
  position:absolute;
  bottom:-9px;
  left:calc(50% - 13px);
  width:26px;
  height:26px;
  background:#facc15;
  border-radius:50%;
  z-index:6;
  box-shadow:0 0 18px #facc15;
}

.gauges{
  grid-column:1/2;
  grid-row:1/4;
  display:grid;
  grid-template-rows:repeat(6,1fr);
  gap:9px;
}
.mini{
  background:rgba(15,23,42,.84);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:9px 11px;
}
.mini-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#cbd5e1;
}
.mini-value{
  font-size:31px;
  font-weight:900;
  color:white;
  margin-top:3px;
}
.mini-bar{
  height:8px;
  border-radius:999px;
  background:#1e293b;
  overflow:hidden;
  margin-top:5px;
}
.mini-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#ef4444,#f97316,#eab308,#22c55e);
}

.fear{
  grid-column:2/3;
  grid-row:3/4;
  display:grid;
  grid-template-columns:42% 58%;
  gap:10px;
  align-items:center;
}
.fear-box{
  text-align:center;
}
.fear-title{color:#94a3b8;font-size:13px}
.fear-score{font-size:52px;font-weight:900;color:white}
.fear-label{color:#facc15;font-weight:900;font-size:22px}
.fear-note{font-size:12px;color:#94a3b8;margin-top:4px}
.fear-bars .row{margin-bottom:8px}

.sectors{
  grid-column:3/4;
  grid-row:1/3;
}
h2{
  margin:0 0 9px;
  color:#f8fafc;
  font-size:18px;
}
.row{margin-bottom:7px}
.row-head{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:3px;
}
.bar{
  height:10px;
  background:#1e293b;
  border-radius:999px;
  overflow:hidden;
}
.fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#f97316,#eab308,#22c55e);
}

.heat{
  grid-column:3/4;
  grid-row:3/4;
}
.heat-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-auto-rows:76px;
  gap:8px;
}
.tile{
  border-radius:14px;
  padding:8px;
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.tile b{font-size:13px}
.tile .flow{font-size:21px;font-weight:900;margin:2px 0}
.tile small{font-size:10px;color:#e5e7eb}

.footer{
  position:fixed;
  bottom:3px;
  left:0;
  right:0;
  text-align:center;
  font-size:10px;
  color:#64748b;
}

@media(max-width:1200px){
  body{overflow:auto}
  .screen{
    height:auto;
    grid-template-columns:1fr;
    grid-template-rows:auto;
  }
  .decision,.gauges,.fear,.sectors,.heat{
    grid-column:auto;
    grid-row:auto;
  }
  .gauges{grid-template-rows:auto;grid-template-columns:repeat(2,1fr)}
  .heat-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>🧭 مزاج السوق</h1>
    <div class="sub">مركز قرار السوق قبل الافتتاح — قراءة مختصرة لكل ظروف التداول</div>
  </div>
  <a class="back" href="/">العودة للوحة الأداء</a>
</div>

<div id="app">جاري تحميل مزاج السوق...</div>

<script>
function angle(v){return (Math.max(0,Math.min(100,Number(v)))*1.8)-90}

function tileColor(score){
  score = Number(score);
  if(score>=80) return "rgba(34,197,94,.32)";
  if(score>=65) return "rgba(234,179,8,.30)";
  if(score>=50) return "rgba(249,115,22,.27)";
  return "rgba(239,68,68,.30)";
}

function fearLabel(v){
  v = Number(v);
  if(v>=85) return "طمع قوي";
  if(v>=70) return "طمع معتدل";
  if(v>=50) return "محايد";
  if(v>=35) return "خوف";
  return "خوف قوي";
}

function demoIfFlat(d){
  const sectors = d.sectors || [];
  const allFlat = sectors.length && sectors.every(s => Number(s.score) === 50 && Number(s.flow) === 0);
  if(!allFlat) return d;

  d.score = 84.8;
  d.decision = {label:"شراء انتقائي", tone:"السوق جيد لكن يحتاج انتقاء", color:"yellow"};
  d.gauges = {
    "الاتجاه العام":100,
    "السيولة":74.2,
    "قوة السوق":64.8,
    "الزخم":100,
    "الخوف والطمع":72,
    "ظروف الأسبوع":80
  };
  d.sectors = [
    {symbol:"XLK",name:"التقنية",score:85,flow:7.61,status:"دخول قوي"},
    {symbol:"XLF",name:"المالي",score:82,flow:5.59,status:"دخول قوي"},
    {symbol:"XLB",name:"المواد",score:78,flow:7.29,status:"دخول قوي"},
    {symbol:"XLI",name:"الصناعي",score:76,flow:6.91,status:"دخول قوي"},
    {symbol:"XLV",name:"الصحي",score:73,flow:1.00,status:"دخول قوي"},
    {symbol:"XLRE",name:"العقاري",score:68,flow:0.72,status:"دخول متوسط"},
    {symbol:"XLP",name:"الاستهلاكي الأساسي",score:62,flow:-0.99,status:"دخول متوسط"},
    {symbol:"XLY",name:"الاستهلاكي الكمالي",score:58,flow:3.07,status:"محايد"},
    {symbol:"XLU",name:"المرافق",score:54,flow:1.98,status:"محايد"},
    {symbol:"XLC",name:"الاتصالات",score:42,flow:-2.00,status:"خروج سيولة"},
    {symbol:"XLE",name:"الطاقة",score:36,flow:-7.55,status:"خروج سيولة"}
  ];
  d.demo = true;
  return d;
}

fetch('/api/market/mood')
.then(r=>r.json())
.then(raw=>{
  let d = demoIfFlat(raw);
  const gaugesObj = d.gauges || {};
  const fearScore = gaugesObj["الخوف والطمع"] || gaugesObj["التقلب"] || 50;

  let gauges = "";
  Object.entries(gaugesObj).forEach(([k,v])=>{
    let title = k === "التقلب" ? "الخوف والطمع" : k;
    gauges += `
      <div class="mini">
        <div class="mini-head"><span>${title}</span><b>${v}%</b></div>
        <div class="mini-value">${v}%</div>
        <div class="mini-bar"><div class="mini-fill" style="width:${v}%"></div></div>
      </div>`;
  });

  let sectorBars = "";
  (d.sectors || []).forEach((s,i)=>{
    sectorBars += `
      <div class="row">
        <div class="row-head">
          <span>${i+1}. ${s.name} <small>${s.symbol}</small></span>
          <b>${s.score}%</b>
        </div>
        <div class="bar"><div class="fill" style="width:${s.score}%"></div></div>
      </div>`;
  });

  let heat = "";
  (d.sectors || []).forEach(s=>{
    heat += `
      <div class="tile" style="background:${tileColor(s.score)}">
        <b>${s.name}</b>
        <div class="flow">${s.flow>0?'+':''}${s.flow}%</div>
        <small>${s.status}</small>
      </div>`;
  });

  document.getElementById("app").className = "screen";
  document.getElementById("app").innerHTML = `
    <div class="gauges">${gauges}</div>

    <div class="card decision">
      <div class="decision-title">القرار النهائي</div>
      <div class="speed">
        <div class="needle" style="transform:rotate(${angle(d.score)}deg)"></div>
        <div class="center-dot"></div>
      </div>
      <div class="big-label">${d.decision.label}</div>
      <div class="big-score">${d.score}</div>
      <div class="tone">${d.decision.tone}</div>
    </div>

    <div class="card fear">
      <div class="fear-box">
        <div class="fear-title">😨 مؤشر الخوف والطمع</div>
        <div class="fear-score">${fearScore}%</div>
        <div class="fear-label">${fearLabel(fearScore)}</div>
        <div class="fear-note">مؤشر مستقل لقياس شهية المخاطرة</div>
      </div>
      <div class="fear-bars">
        <div class="row">
          <div class="row-head"><span>الخوف</span><b>${100-fearScore}%</b></div>
          <div class="bar"><div class="fill" style="width:${100-fearScore}%"></div></div>
        </div>
        <div class="row">
          <div class="row-head"><span>الطمع</span><b>${fearScore}%</b></div>
          <div class="bar"><div class="fill" style="width:${fearScore}%"></div></div>
        </div>
        <div class="row">
          <div class="row-head"><span>شهية المخاطرة</span><b>${d.score}%</b></div>
          <div class="bar"><div class="fill" style="width:${d.score}%"></div></div>
        </div>
      </div>
    </div>

    <div class="card sectors">
      <h2>💰 دوران السيولة بين القطاعات</h2>
      ${sectorBars}
    </div>

    <div class="card heat">
      <h2>🗺️ خريطة الأموال</h2>
      <div class="heat-grid">${heat}</div>
    </div>

    <div class="footer">
      آخر تحديث: ${d.updated_at || "-"} ${d.demo ? " — عرض تجريبي مؤقت حتى ربط البيانات الحقيقية" : ""}
    </div>
  `;
})
.catch(e=>{
  document.getElementById("app").innerHTML = `<div class="card">خطأ في تحميل البيانات: ${e}</div>`;
});
</script>

</body>
</html>
